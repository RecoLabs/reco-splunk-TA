[admin:TA_reco_configuration]
match = /
members = TA_reco_settings

[admin:TA_reco_inputs]
match = /
members = TA_reco_reco_accounts, TA_reco_reco_alerts, TA_reco_reco_discovery, TA_reco_reco_identities, TA_reco_reco_posture, TA_reco_reco_system_logs

[admin_external:TA_reco_settings]
handlertype = python
python.version = python3
python.required = 3.13
handlerfile = TA_reco_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

